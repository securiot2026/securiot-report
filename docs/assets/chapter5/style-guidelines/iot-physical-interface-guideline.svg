<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Guía visual para la interfaz física IoT de SecurIoT</title>
  <desc id="desc">Esquema conceptual de un dispositivo con indicadores diferenciados para conexión, validación, autorización e intrusión.</desc>
  <rect width="1200" height="820" rx="24" fill="#0B0E14"/>
  <text x="64" y="72" fill="#EEF0F4" font-family="Sora, Arial, sans-serif" font-size="34" font-weight="700">Interfaz física IoT</text>
  <text x="64" y="110" fill="#8B93A3" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="20">La señal física conserva el mismo significado que la interfaz digital.</text>

  <g transform="translate(88 160)">
    <rect width="430" height="510" rx="36" fill="#151A23" stroke="#2C3442" stroke-width="3"/>
    <image x="110" y="24" width="220" height="163" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64," aria-label="Lockup apilado oficial de SecurIoT"/>
    <rect x="139" y="205" width="152" height="34" rx="17" fill="#0B0E14" stroke="#2C3442"/>
    <text x="215" y="228" text-anchor="middle" fill="#8B93A3" font-family="Martian Mono, Consolas, monospace" font-size="14" letter-spacing="2">EDGE NODE</text>
    <line x1="55" y1="260" x2="375" y2="260" stroke="#2C3442"/>
    <g transform="translate(55 288)" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="18">
      <circle cx="12" cy="12" r="10" fill="#6C7CE8"/><text x="36" y="19" fill="#EEF0F4">Validando</text>
      <circle cx="12" cy="62" r="10" fill="#22DD66"/><text x="36" y="69" fill="#EEF0F4">Acceso autorizado</text>
      <circle cx="12" cy="112" r="10" fill="#FF5C6C"/><text x="36" y="119" fill="#EEF0F4">Intrusión</text>
      <circle cx="12" cy="162" r="10" fill="#8B93A3"/><text x="36" y="169" fill="#EEF0F4">Sin conexión</text>
    </g>
  </g>

  <g transform="translate(590 170)" font-family="Schibsted Grotesk, Arial, sans-serif">
    <g transform="translate(0 0)">
      <rect width="520" height="92" rx="16" fill="#151A23" stroke="#2C3442"/>
      <circle cx="46" cy="46" r="14" fill="#6C7CE8"/>
      <text x="82" y="40" fill="#EEF0F4" font-size="20" font-weight="700">Validando</text>
      <text x="82" y="66" fill="#8B93A3" font-size="16">Pulso breve y texto o patrón asociado.</text>
    </g>
    <g transform="translate(0 112)">
      <rect width="520" height="92" rx="16" fill="#151A23" stroke="#2C3442"/>
      <circle cx="46" cy="46" r="14" fill="#22DD66"/>
      <text x="82" y="40" fill="#EEF0F4" font-size="20" font-weight="700">Autorizado</text>
      <text x="82" y="66" fill="#8B93A3" font-size="16">Confirmación luminosa y señal breve.</text>
    </g>
    <g transform="translate(0 224)">
      <rect width="520" height="92" rx="16" fill="#151A23" stroke="#2C3442"/>
      <circle cx="46" cy="46" r="14" fill="#FF5C6C"/>
      <text x="82" y="40" fill="#EEF0F4" font-size="20" font-weight="700">Intrusión</text>
      <text x="82" y="66" fill="#8B93A3" font-size="16">Patrón persistente y señal diferenciada.</text>
    </g>
    <g transform="translate(0 336)">
      <rect width="520" height="92" rx="16" fill="#151A23" stroke="#2C3442"/>
      <circle cx="46" cy="46" r="14" fill="#8B93A3"/>
      <text x="82" y="40" fill="#EEF0F4" font-size="20" font-weight="700">Sin conexión</text>
      <text x="82" y="66" fill="#8B93A3" font-size="16">Patrón distinto de una alarma real.</text>
    </g>
  </g>

  <text x="64" y="750" fill="#8B93A3" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="18">
    <tspan x="64" dy="0">El color siempre se complementa con texto, icono, duración o patrón</tspan>
    <tspan x="64" dy="28">para evitar ambigüedades.</tspan>
  </text>
</svg>
