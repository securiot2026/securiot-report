<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="700" fill="#1f2937">Empathy Map — Miguel Herrera</text>
  <text x="20" y="50" font-size="13" fill="#6b7280">Segmento gerencial · Gerente o Dueño de Pyme Industrial</text>

  <!-- Quadrants -->
  <!-- DICE -->
  <rect x="20" y="66" width="470" height="230" rx="10" fill="#e8f4f2" stroke="#2a9d8f"/>
  <text x="40" y="92" font-size="15" font-weight="700" fill="#1f6f66">DICE</text>
  <g font-size="13.5" fill="#274b46">
    <text x="40" y="122">• "Necesito saber el estado de la seguridad cuando</text>
    <text x="54" y="140">no estoy en la planta."</text>
    <text x="40" y="168">• "Quiero evidencia para tomar decisiones."</text>
    <text x="40" y="196">• "¿Vale lo que invierto en seguridad?"</text>
    <text x="40" y="224">• "Prefiero enterarme a tiempo, no después."</text>
  </g>

  <!-- PIENSA -->
  <rect x="510" y="66" width="470" height="230" rx="10" fill="#eef2fb" stroke="#3f5aa6"/>
  <text x="530" y="92" font-size="15" font-weight="700" fill="#2f4685">PIENSA</text>
  <g font-size="13.5" fill="#2b3a63">
    <text x="530" y="122">• Un incidente puede frenar la operación.</text>
    <text x="530" y="150">• Depender solo de la revisión humana es un riesgo.</text>
    <text x="530" y="178">• Necesito visibilidad aunque esté fuera.</text>
    <text x="530" y="206">• La seguridad debe justificar su costo.</text>
  </g>

  <!-- HACE -->
  <rect x="20" y="312" width="470" height="230" rx="10" fill="#fff5e6" stroke="#e09f3e"/>
  <text x="40" y="338" font-size="15" font-weight="700" fill="#a86a12">HACE</text>
  <g font-size="13.5" fill="#5c451a">
    <text x="40" y="368">• Supervisa la operación y la gestión del negocio.</text>
    <text x="40" y="396">• Consulta cámaras y controles de ingreso.</text>
    <text x="40" y="424">• Coordina por llamada y mensajería.</text>
    <text x="40" y="452">• Revisa reportes y decide sobre la inversión.</text>
  </g>

  <!-- SIENTE -->
  <rect x="510" y="312" width="470" height="230" rx="10" fill="#fdecec" stroke="#c9433f"/>
  <text x="530" y="338" font-size="15" font-weight="700" fill="#a5302c">SIENTE</text>
  <g font-size="13.5" fill="#6e2320">
    <text x="530" y="368">• Preocupación por los activos cuando está fuera.</text>
    <text x="530" y="396">• Frustración por herramientas separadas y costosas.</text>
    <text x="530" y="424">• Incertidumbre sobre el valor de la inversión.</text>
    <text x="530" y="452">• Tranquilidad cuando tiene evidencia clara.</text>
  </g>

  <!-- center badge -->
  <circle cx="500" cy="304" r="46" fill="#1f3a5f"/>
  <text x="500" y="300" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Miguel</text>
  <text x="500" y="316" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Herrera</text>
</svg>
